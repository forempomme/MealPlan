apply plugin: 'com.android.application'

android {
    namespace 'com.mealplan.app'
    compileSdk 34

    defaultConfig {
        applicationId  "com.mealplan.app"
        minSdk         23
        targetSdk      34
        versionCode    210
        versionName    "2.1.0"
    }

    signingConfigs {
        release {
            storeFile     file(project.findProperty("storeFile")    ?: "meal-plan.keystore")
            storePassword project.findProperty("storePassword")     ?: ""
            keyAlias      project.findProperty("keyAlias")          ?: "meal-plan"
            keyPassword   project.findProperty("keyPassword")       ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled   false
            signingConfig   signingConfigs.release
            proguardFiles   getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// ── Résolution du conflit kotlin-stdlib-jdk7/jdk8 vs kotlin-stdlib 1.8+ ──
// androidx.appcompat tire d'anciennes versions de kotlin-stdlib-jdk7/jdk8
// qui entrent en conflit avec la kotlin-stdlib 1.8.22 incluse par AGP.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
            details.because 'Uniformiser kotlin-stdlib pour éviter les classes dupliquées'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
