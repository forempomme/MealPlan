name: 🍽 Build Meal Plan APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Note de version (optionnel)'
        required: false
        default: ''

env:
  APP_NAME: "Meal-Plan"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      # ── 2. Lecture de la version ─────────────────────────
      - name: Lire la version depuis package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # ── 3. Node.js ───────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      # ── 4. Java 17 ───────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. Gradle ────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      # ── 6. Dépendances npm ───────────────────────────────
      - name: Installer les dépendances npm
        run: npm install

      # ── 7. Build web ─────────────────────────────────────
      - name: Builder l'application web (Vite)
        run: npm run build

      # ── 8. Copier assets vers Android ────────────────────
      - name: Copier dist/ vers android/app/src/main/assets/
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      # ── 9. Restaurer le keystore ─────────────────────────
      - name: Restaurer le keystore depuis GitHub Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/meal-plan.keystore
          echo "✅ Keystore restauré ($(wc -c < android/app/meal-plan.keystore) octets)"

      # ── 10. Build APK signé ──────────────────────────────
      - name: Build APK Release signé
        working-directory: android
        run: |
          gradle :app:assembleRelease \
            -PstoreFile=meal-plan.keystore \
            -PstorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.KEY_ALIAS }}" \
            -PkeyPassword="${{ secrets.KEY_PASSWORD }}"

      # ── 11. Renommer l'APK ───────────────────────────────
      - name: Renommer l'APK avec le numéro de version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="${APP_NAME}-v${VERSION}.apk"
          mv "$APK_SRC" "$APK_DEST"
          echo "APK_DEST=$APK_DEST" >> $GITHUB_ENV
          echo "VERSION=$VERSION"   >> $GITHUB_ENV
          ls -lh "$APK_DEST"

      # ── 12. Upload APK uniquement ────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: "${{ env.APP_NAME }}-v${{ env.VERSION }}"
          path: ${{ env.APK_DEST }}
          retention-days: 90

      # ── 13. Résumé ───────────────────────────────────────
      - name: Résumé du build
        run: |
          NOTE="${{ inputs.note }}"
          echo "### ✅ Meal Plan v${{ env.VERSION }} — Build réussi" >> $GITHUB_STEP_SUMMARY
          [ -n "$NOTE" ] && echo "> $NOTE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Fichier | Taille |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.APK_DEST }}\` | $(du -h ${{ env.APK_DEST }} | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Téléchargez dans l'onglet **Actions → Artifacts**." >> $GITHUB_STEP_SUMMARY
