name: 🍽 Build Meal Plan APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Note de version (optionnel)'
        required: false
        default: ''

env:
  APP_NAME: "Meal-Plan"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.2

      - name: Lire la version depuis package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Installer les dépendances npm
        run: npm install

      - name: Builder l'application web (Vite)
        run: npm run build

      # ── Patch index.html pour WebView Android ────────────────
      # Problème : Vite met <script type="module"> dans <head>.
      #   1) type="module" est bloqué sur file:// (null origin CORS)
      #   2) Sans type="module", le script s'exécute AVANT </body>
      #      donc document.getElementById('root') retourne null
      #      et React plante silencieusement → écran noir.
      # Solution : remplacer type="module" par defer
      #   - defer = exécution après parsing complet du DOM ✓
      #   - pas de restriction ES module sur file:// ✓
      - name: Patcher index.html — remplacer type="module" par defer
        run: |
          echo "=== Avant patch ==="
          grep -n "script\|link rel" dist/index.html || true

          # Remplace type="module" crossorigin par defer (conserve l'attribut src)
          sed -i 's/type="module" crossorigin/defer/g' dist/index.html
          # Au cas où l'ordre serait différent
          sed -i 's/crossorigin type="module"/defer/g' dist/index.html
          # Nettoie type="module" seul si encore présent
          sed -i 's/ type="module"//g' dist/index.html
          # Nettoie crossorigin seul si encore présent
          sed -i 's/ crossorigin//g' dist/index.html
          # Supprime les <link rel="modulepreload"> (inutiles)
          sed -i '/<link rel="modulepreload"/d' dist/index.html

          echo ""
          echo "=== Après patch ==="
          grep -n "script\|link rel" dist/index.html || true

          if grep -q 'type="module"' dist/index.html; then
            echo "❌ type=module encore présent !"
            exit 1
          fi
          if ! grep -q 'defer' dist/index.html; then
            echo "❌ defer absent de index.html !"
            exit 1
          fi
          echo "✅ Patch OK — script defer sans type=module"

      - name: Copier dist/ vers android/app/src/main/assets/
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          echo "Assets copiés :"
          find android/app/src/main/assets/ -type f | sort

      - name: Restaurer le keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/meal-plan.keystore
          echo "✅ Keystore restauré"

      - name: Build APK Release signé
        working-directory: android
        run: |
          gradle :app:assembleRelease \
            -PstoreFile=meal-plan.keystore \
            -PstorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.KEY_ALIAS }}" \
            -PkeyPassword="${{ secrets.KEY_PASSWORD }}"

      - name: Renommer l'APK
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="${APP_NAME}-v${VERSION}.apk"
          mv "$APK_SRC" "$APK_DEST"
          echo "APK_DEST=$APK_DEST" >> $GITHUB_ENV
          echo "VERSION=$VERSION"   >> $GITHUB_ENV
          ls -lh "$APK_DEST"

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: "${{ env.APP_NAME }}-v${{ env.VERSION }}"
          path: ${{ env.APK_DEST }}
          retention-days: 90

      - name: Résumé
        run: |
          NOTE="${{ inputs.note }}"
          echo "### ✅ Meal Plan v${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          [ -n "$NOTE" ] && echo "> $NOTE" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.APK_DEST }}\` | $(du -h ${{ env.APK_DEST }} | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Actions → Artifacts**" >> $GITHUB_STEP_SUMMARY
